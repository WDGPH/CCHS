[project]
name = "cchs-bootstrap"
version = "0.1.0"
description = "Streamlit app for CCHS bootstrap analysis"
authors = [ { name = "Eswar Attuluri" } ]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
  "streamlit==1.60.0",
  "pandas==2.2.2",
  "numpy==2.4.6",
  "pyarrow==24.0.0",
  "matplotlib>=3.9.2",
  "openpyxl==3.1.5",
  "altair==6.2.2",
  "pypdf==6.14.2",
]

[tool.uv]
# Enable deterministic resolution
# Note: 'locked' is not a valid uv.toml field - use uv.lock file for locking

[dependency-groups]
dev = [
  "pytest>=9.0.3",
]
