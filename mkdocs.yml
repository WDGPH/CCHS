extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
markdown_extensions:
  - attr_list
  - admonition
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.snippets:
      base_path:
        - "."
      check_paths: true
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Adding a New CCHS Cycle: ADDING_A_CYCLE.md
  - Bootstrap Methodology: bootstrap_analysis_documentation.md
  - Data Quality and Privacy:
      - CCHS 2024 Data Quality Standards: CCHS_2024_Data_Quality_Standards.md
      - Privacy and Security Guide: CCHS_Data_Privacy_Security_Guide.md
  - Third-Party Data and Licensing: THIRD_PARTY_DATA.md
  - Code Reference: reference.md
  - Contributing: CONTRIBUTING.md
  - Security Policy: SECURITY.md
  - Code of Conduct: CODE_OF_CONDUCT.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            members_order: source
            separate_signature: true
            show_overloads: true
            show_submodules: false
            show_root_heading: true
            show_root_full_path: true
            show_root_toc_entry: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
repo_url: https://github.com/WDGPH/CCHS
repo_name: WDGPH/CCHS
site_name: CCHS Bootstrap Analysis Tool
site_description: Documentation for the WDGPH CCHS Bootstrap Analysis Tool
site_url: https://wdgph.github.io/docs/cchs/latest/
theme:
  name: material
